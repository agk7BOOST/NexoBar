services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: nexobar_e2e
      POSTGRES_USER: nexobar_e2e
      POSTGRES_PASSWORD: nexobar_e2e_password
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 5s
